<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications - EasyLoan India</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6fa;
    color:#172033;
}

.app{
    max-width:520px;
    margin:auto;
    min-height:100vh;
    padding-bottom:40px;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#155eef,#4f8cff);
    color:white;
    padding:20px 18px 28px;
    border-radius:0 0 25px 25px;
}

.header-top{
    display:flex;
    align-items:center;
    gap:13px;
}

.back{
    width:38px;
    height:38px;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    cursor:pointer;
}

.header-content{
    flex:1;
}

.header h2{
    font-size:20px;
}

.header p{
    margin-top:5px;
    font-size:12px;
    opacity:.85;
}

.count{
    min-width:24px;
    height:24px;
    padding:0 6px;
    border-radius:20px;
    background:white;
    color:#155eef;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:bold;
}

/* FILTER */
.filter-wrap{
    padding:15px;
}

.filter-bar{
    background:white;
    padding:5px;
    border-radius:12px;
    display:flex;
    gap:5px;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.filter-btn{
    flex:1;
    height:35px;
    border:none;
    border-radius:8px;
    background:transparent;
    color:#737d8e;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
}

.filter-btn.active{
    background:#eef3ff;
    color:#155eef;
}

/* SECTION */
.section{
    padding:0 15px 15px;
}

.section-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.section-heading h3{
    font-size:15px;
}

.mark-read{
    border:none;
    background:transparent;
    color:#155eef;
    font-size:9px;
    font-weight:bold;
    cursor:pointer;
}

/* LOADING */
.loading{
    background:white;
    border-radius:17px;
    padding:35px 20px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
    color:#7c8596;
    font-size:10px;
}

.spinner{
    width:28px;
    height:28px;
    border:3px solid #e5eaf2;
    border-top-color:#155eef;
    border-radius:50%;
    margin:0 auto 12px;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* NOTIFICATION */
.notification{
    background:white;
    border-radius:15px;
    padding:14px;
    margin-bottom:9px;
    display:flex;
    gap:11px;
    box-shadow:0 3px 12px rgba(0,0,0,.035);
    position:relative;
    cursor:pointer;
    transition:.2s;
}

.notification:hover{
    transform:translateY(-1px);
}

.notification.unread{
    background:#f8faff;
}

.notification.unread::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:3px;
    background:#155eef;
    border-radius:10px 0 0 10px;
}

.notification-icon{
    width:42px;
    height:42px;
    flex-shrink:0;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
    background:#eef3ff;
}

.icon-green{
    background:#e7f8ef;
}

.icon-orange{
    background:#fff4dd;
}

.icon-red{
    background:#ffe9e9;
}

.icon-purple{
    background:#f0eaff;
}

.notification-content{
    flex:1;
    min-width:0;
}

.notification-top{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.notification-title{
    font-size:11px;
    font-weight:bold;
}

.notification-time{
    font-size:8px;
    color:#929aaa;
    white-space:nowrap;
}

.notification-message{
    margin-top:5px;
    font-size:9px;
    color:#737d8e;
    line-height:1.5;
}

.unread-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#155eef;
    margin-top:5px;
    flex-shrink:0;
}

/* EMPTY */
.empty{
    display:none;
    background:white;
    border-radius:17px;
    padding:40px 20px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.empty-icon{
    font-size:38px;
}

.empty h3{
    margin-top:12px;
    font-size:15px;
}

.empty p{
    margin-top:6px;
    font-size:9px;
    color:#7c8596;
}

/* ERROR */
.error-box{
    display:none;
    background:#fff0f0;
    color:#c62828;
    border:1px solid #ffd0d0;
    border-radius:14px;
    padding:15px;
    font-size:10px;
    line-height:1.5;
    margin-bottom:12px;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:500;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:20px;
    padding:23px;
}

.modal-top{
    display:flex;
    align-items:center;
    gap:11px;
}

.modal-icon{
    width:44px;
    height:44px;
    border-radius:12px;
    background:#eef3ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.modal-title{
    font-size:14px;
    font-weight:bold;
}

.modal-time{
    margin-top:4px;
    font-size:8px;
    color:#8b94a3;
}

.modal-message{
    margin-top:18px;
    background:#f6f8fb;
    padding:14px;
    border-radius:11px;
    color:#697385;
    font-size:10px;
    line-height:1.6;
}

.close-btn{
    width:100%;
    height:43px;
    margin-top:16px;
    border:none;
    border-radius:9px;
    background:#155eef;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

@media(max-width:360px){
    .notification-time{
        display:none;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">

        <div class="header-top">

            <div class="back" onclick="go('index.html')">
                ←
            </div>

            <div class="header-content">
                <h2>Notifications</h2>
                <p>Stay updated about your account</p>
            </div>

            <div class="count" id="headerCount">
                0
            </div>

        </div>

    </div>


    <!-- FILTER -->
    <div class="filter-wrap">

        <div class="filter-bar">

            <button class="filter-btn active"
                    onclick="filterNotifications('all',this)">
                All
            </button>

            <button class="filter-btn"
                    onclick="filterNotifications('unread',this)">
                Unread
            </button>

            <button class="filter-btn"
                    onclick="filterNotifications('loan',this)">
                Loans
            </button>

            <button class="filter-btn"
                    onclick="filterNotifications('payment',this)">
                Payments
            </button>

        </div>

    </div>


    <!-- NOTIFICATIONS -->
    <div class="section">

        <div class="section-heading">

            <h3>Recent Notifications</h3>

            <button class="mark-read"
                    onclick="markAllRead()">
                Mark all as read
            </button>

        </div>


        <div class="error-box" id="errorBox"></div>


        <!-- LOADING -->
        <div class="loading" id="loadingBox">

            <div class="spinner"></div>

            Loading notifications...

        </div>


        <!-- FIREBASE NOTIFICATIONS -->
        <div id="notificationList"></div>


        <!-- EMPTY -->
        <div class="empty" id="emptyState">

            <div class="empty-icon">
                🔔
            </div>

            <h3>No Notifications</h3>

            <p>
                There are no notifications in this category.
            </p>

        </div>

    </div>

</div>


<!-- MODAL -->
<div class="modal" id="notificationModal">

    <div class="modal-box">

        <div class="modal-top">

            <div class="modal-icon" id="modalIcon">
                🔔
            </div>

            <div>

                <div class="modal-title" id="modalTitle">
                    Notification
                </div>

                <div class="modal-time" id="modalTime">
                    Just now
                </div>

            </div>

        </div>


        <div class="modal-message" id="modalMessage">
            Notification details.
        </div>


        <button class="close-btn"
                onclick="closeNotification()">
            Close
        </button>

    </div>

</div>


<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {
    apiKey: "AIzaSyCCSSnvJ1w9CGd68TAy9ZVH9Taw1J0-xdE",
    authDomain: "easyloan-india.firebaseapp.com",
    projectId: "easyloan-india",
    storageBucket: "easyloan-india.firebasestorage.app",
    messagingSenderId: "925263655882",
    appId: "1:925263655882:web:0dd41e9964bd9a7a93d533"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();


/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;
let notifications = [];
let currentFilter = "all";


/* =====================================================
   NAVIGATION
===================================================== */

function go(page){
    window.location.href = page;
}


/* =====================================================
   AUTH
===================================================== */

auth.onAuthStateChanged(async function(user){

    currentUser = user || null;

    if(!currentUser){

        try{

            await auth.signInAnonymously();

        }catch(error){

            console.error(error);

            showError(
                "Login required. Firebase Authentication me user login nahi hai."
            );

            hideLoading();

        }

        return;
    }

    loadNotifications();

});


/* =====================================================
   LOAD FIREBASE NOTIFICATIONS
===================================================== */

function loadNotifications(){

    if(!currentUser){
        return;
    }

    const uid = currentUser.uid;

    const ref = db.ref("userNotifications/" + uid);


    ref.on("value", function(snapshot){

        notifications = [];

        snapshot.forEach(function(child){

            const data = child.val() || {};

            notifications.push({

                id: child.key,

                title:
                    data.title ||
                    data.heading ||
                    "Notification",

                message:
                    data.message ||
                    data.body ||
                    data.text ||
                    "You have a new notification.",

                type:
                    normalizeType(
                        data.type ||
                        data.category ||
                        ""
                    ),

                icon:
                    data.icon ||
                    getDefaultIcon(data.type),

                read:
                    data.read === true ||
                    data.status === "read",

                createdAt:
                    data.createdAt ||
                    data.timestamp ||
                    data.time ||
                    0

            });

        });


        /* NEWEST FIRST */

        notifications.sort(function(a,b){

            return getTime(b.createdAt)
                 - getTime(a.createdAt);

        });


        hideLoading();

        hideError();

        renderNotifications();

    }, function(error){

        console.error(
            "Notification Firebase Error:",
            error
        );

        hideLoading();

        showError(
            "Notifications load nahi ho pa rahi hain. Firebase Rules check karo."
        );

    });

}


/* =====================================================
   TYPE NORMALIZE
===================================================== */

function normalizeType(type){

    type = String(type || "").toLowerCase();

    if(
        type.includes("loan") ||
        type.includes("application") ||
        type.includes("kyc") ||
        type.includes("document")
    ){
        return "loan";
    }

    if(
        type.includes("payment") ||
        type.includes("emi") ||
        type.includes("fee") ||
        type.includes("recharge") ||
        type.includes("withdraw")
    ){
        return "payment";
    }

    return "other";
}


/* =====================================================
   DEFAULT ICON
===================================================== */

function getDefaultIcon(type){

    type = String(type || "").toLowerCase();

    if(type.includes("loan")){
        return "💰";
    }

    if(
        type.includes("payment") ||
        type.includes("emi") ||
        type.includes("fee")
    ){
        return "₹";
    }

    if(type.includes("kyc")){
        return "✓";
    }

    if(type.includes("document")){
        return "📄";
    }

    return "🔔";
}


/* =====================================================
   TIME
===================================================== */

function getTime(value){

    if(!value){
        return 0;
    }

    if(typeof value === "number"){

        /*
         Firebase ServerValue.TIMESTAMP
         milliseconds
        */

        return value;
    }

    const parsed = new Date(value).getTime();

    return isNaN(parsed) ? 0 : parsed;
}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(value){

    const time = getTime(value);

    if(!time){
        return "Just now";
    }

    const diff =
        Date.now() - time;

    const minute =
        Math.floor(diff / 60000);

    const hour =
        Math.floor(diff / 3600000);

    const day =
        Math.floor(diff / 86400000);


    if(minute < 1){
        return "Just now";
    }

    if(minute < 60){
        return minute + " min ago";
    }

    if(hour < 24){
        return hour + " hour" +
               (hour > 1 ? "s" : "") +
               " ago";
    }

    if(day < 7){
        return day + " day" +
               (day > 1 ? "s" : "") +
               " ago";
    }


    return new Date(time).toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );
}


/* =====================================================
   ICON CLASS
===================================================== */

function getIconClass(type){

    if(type === "loan"){
        return "icon-green";
    }

    if(type === "payment"){
        return "icon-orange";
    }

    if(type === "other"){
        return "icon-purple";
    }

    return "";
}


/* =====================================================
   RENDER
===================================================== */

function renderNotifications(){

    const list =
        document.getElementById(
            "notificationList"
        );

    list.innerHTML = "";


    let filtered =
        notifications.filter(function(item){

            if(currentFilter === "all"){
                return true;
            }

            if(currentFilter === "unread"){
                return !item.read;
            }

            if(currentFilter === "loan"){
                return item.type === "loan";
            }

            if(currentFilter === "payment"){
                return item.type === "payment";
            }

            return true;

        });


    if(filtered.length === 0){

        document.getElementById(
            "emptyState"
        ).style.display = "block";

    }else{

        document.getElementById(
            "emptyState"
        ).style.display = "none";

    }


    filtered.forEach(function(item){

        const notification =
            document.createElement("div");

        notification.className =
            "notification " +
            (item.read ? "" : "unread") +
            " " +
            item.type;


        notification.dataset.id =
            item.id;


        notification.onclick =
            function(){

                openNotification(item);

            };


        const icon =
            document.createElement("div");

        icon.className =
            "notification-icon " +
            getIconClass(item.type);

        icon.innerText =
            item.icon;


        const content =
            document.createElement("div");

        content.className =
            "notification-content";


        const top =
            document.createElement("div");

        top.className =
            "notification-top";


        const title =
            document.createElement("div");

        title.className =
            "notification-title";

        title.innerText =
            item.title;


        const time =
            document.createElement("div");

        time.className =
            "notification-time";

        time.innerText =
            formatTime(item.createdAt);


        top.appendChild(title);
        top.appendChild(time);


        const message =
            document.createElement("div");

        message.className =
            "notification-message";

        message.innerText =
            item.message;


        content.appendChild(top);
        content.appendChild(message);


        notification.appendChild(icon);
        notification.appendChild(content);


        if(!item.read){

            const dot =
                document.createElement("div");

            dot.className =
                "unread-dot";

            notification.appendChild(dot);

        }


        list.appendChild(notification);

    });


    updateCount();

}


/* =====================================================
   UPDATE UNREAD COUNT
===================================================== */

function updateCount(){

    const unread =
        notifications.filter(function(item){

            return !item.read;

        }).length;


    document.getElementById(
        "headerCount"
    ).innerText = unread;

}


/* =====================================================
   OPEN NOTIFICATION
===================================================== */

function openNotification(item){

    document.getElementById(
        "modalTitle"
    ).innerText = item.title;


    document.getElementById(
        "modalTime"
    ).innerText =
        formatTime(item.createdAt);


    document.getElementById(
        "modalMessage"
    ).innerText = item.message;


    document.getElementById(
        "modalIcon"
    ).innerText = item.icon;


    document.getElementById(
        "notificationModal"
    ).style.display = "flex";


    /* MARK READ */

    if(!item.read){

        markAsRead(item);

    }

}


/* =====================================================
   MARK SINGLE READ
===================================================== */

function markAsRead(item){

    if(!currentUser){
        return;
    }

    const uid =
        currentUser.uid;


    db.ref(
        "userNotifications/" +
        uid +
        "/" +
        item.id
    ).update({

        read: true

    }).catch(function(error){

        console.error(
            "Read update error:",
            error
        );

    });

}


/* =====================================================
   MARK ALL READ
===================================================== */

function markAllRead(){

    if(!currentUser){
        return;
    }


    const unread =
        notifications.filter(function(item){

            return !item.read;

        });


    if(unread.length === 0){
        return;
    }


    const updates = {};


    unread.forEach(function(item){

        updates[
            item.id + "/read"
        ] = true;

    });


    db.ref(
        "userNotifications/" +
        currentUser.uid
    ).update(updates)

    .then(function(){

        console.log(
            "All notifications marked as read"
        );

    })

    .catch(function(error){

        console.error(error);

        showError(
            "Notifications read update nahi ho paayi."
        );

    });

}


/* =====================================================
   FILTER
===================================================== */

function filterNotifications(
    type,
    button
){

    currentFilter = type;


    document
        .querySelectorAll(".filter-btn")
        .forEach(function(btn){

            btn.classList.remove(
                "active"
            );

        });


    button.classList.add("active");


    renderNotifications();

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeNotification(){

    document.getElementById(
        "notificationModal"
    ).style.display = "none";

}


/* =====================================================
   OUTSIDE MODAL
===================================================== */

document
    .getElementById(
        "notificationModal"
    )
    .addEventListener(
        "click",
        function(e){

            if(e.target === this){

                closeNotification();

            }

        }
    );


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Escape"){

            closeNotification();

        }

    }
);


/* =====================================================
   LOADING / ERROR
===================================================== */

function hideLoading(){

    document.getElementById(
        "loadingBox"
    ).style.display = "none";

}


function showError(message){

    const box =
        document.getElementById(
            "errorBox"
        );

    box.innerText = message;

    box.style.display = "block";

}


function hideError(){

    document.getElementById(
        "errorBox"
    ).style.display = "none";

}

</script>

</body>
</html>
