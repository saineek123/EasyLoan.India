<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | EasyLoan India</title>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1565c0, #0d47a1);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .forgot-container {
            width: 100%;
            max-width: 430px;
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            margin: 20px;
            text-align: center;
        }

        .logo {
            color: #1565c0;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .logo i {
            font-size: 40px;
            margin-bottom: 10px;
            display: block;
        }

        h2 {
            margin-bottom: 5px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 13px 45px 13px 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: #1565c0;
        }

        .input-group i {
            position: absolute;
            right: 15px;
            top: 42px;
            color: #777;
        }

        .reset-btn {
            width: 100%;
            padding: 15px;
            border: none;
            background: #1565c0;
            color: #fff;
            font-size: 17px;
            border-radius: 10px;
            cursor: pointer;
            transition: .3s;
            font-weight: 600;
        }

        .reset-btn:hover {
            background: #0d47a1;
        }

        .reset-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-link {
            margin-top: 20px;
        }

        .back-link a {
            color: #1565c0;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            z-index: 999;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            transform: translateX(120%);
            transition: transform 0.4s ease;
            max-width: 360px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: #2e7d32;
        }

        .toast.error {
            background: #c62828;
        }

        .toast.info {
            background: #0d47a1;
        }

        @media(max-width:500px) {
            .forgot-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <div id="toast" class="toast"></div>

    <div class="forgot-container">

        <div class="logo">
            <i class="fa-solid fa-building-columns"></i>
            EasyLoan India
        </div>

        <h2>Reset Password</h2>
        <p>Enter your email to receive a password reset link.</p>

        <form id="forgotForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
                <i class="fa-solid fa-envelope"></i>
            </div>

            <button type="submit" class="reset-btn" id="resetBtn">
                <i class="fa-solid fa-spinner fa-spin" style="display:none;"></i>
                Send Reset Link
            </button>
        </form>

        <div class="back-link">
            <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCCSSnvJ1w9CGd68TAy9ZVH9Taw1J0-xdE",
            authDomain: "easyloan-india.firebaseapp.com",
            projectId: "easyloan-india",
            storageBucket: "easyloan-india.firebasestorage.app",
            messagingSenderId: "925263655882",
            appId: "1:925263655882:web:0dd41e9964bd9a7a93d533"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        document.getElementById("forgotForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const resetBtn = document.getElementById("resetBtn");

            if (!email) {
                showToast('⚠️ Please enter your email', 'error');
                return;
            }

            resetBtn.disabled = true;
            resetBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

            auth.sendPasswordResetEmail(email)
                .then(() => {
                    showToast('✅ Password reset link sent to your email!', 'success');
                    document.getElementById('email').value = '';
                })
                .catch((error) => {
                    console.error('Password Reset Error:', error);
                    let errorMsg = '❌ Failed to send reset link. ';
                    if (error.code === 'auth/user-not-found') {
                        errorMsg += 'No account found with this email.';
                    } else {
                        errorMsg += error.message;
                    }
                    showToast(errorMsg, 'error');
                })
                .finally(() => {
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = 'Send Reset Link';
                });
        });
    </script>

</body>
</html>
