<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Loans | EasyLoan India</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fb;
    color:#172033;
}

.app{
    max-width:1100px;
    margin:auto;
    min-height:100vh;
    padding-bottom:40px;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#155eef,#4f8cff);
    color:white;
    padding:22px 20px 28px;
    border-radius:0 0 22px 22px;
}

.header-top{
    display:flex;
    align-items:center;
    gap:13px;
}

.back{
    width:40px;
    height:40px;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    cursor:pointer;
}

.header-content{
    flex:1;
}

.header h2{
    font-size:21px;
}

.header p{
    margin-top:5px;
    font-size:9px;
    opacity:.85;
}

/* CONTENT */

.content{
    padding:20px;
}

/* ERROR */

.error-box{
    display:none;
    background:#ffe9e9;
    color:#b42318;
    padding:13px;
    border-radius:12px;
    margin-bottom:15px;
    font-size:10px;
}

/* LOADING */

.loading{
    background:white;
    border-radius:17px;
    padding:35px 20px;
    text-align:center;
    color:#8992a1;
    font-size:10px;
}

/* SUMMARY */

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
}

.summary-card{
    background:white;
    border-radius:15px;
    padding:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.035);
}

.summary-icon{
    width:37px;
    height:37px;
    border-radius:10px;
    background:#eef3ff;
    color:#155eef;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
}

.summary-card:nth-child(2) .summary-icon{
    background:#e7f8ef;
    color:#168352;
}

.summary-card:nth-child(3) .summary-icon{
    background:#fff4dd;
    color:#b96c00;
}

.summary-card:nth-child(4) .summary-icon{
    background:#f1eaff;
    color:#7544d8;
}

.summary-label{
    margin-top:11px;
    color:#8992a1;
    font-size:8px;
}

.summary-value{
    margin-top:5px;
    font-size:18px;
    font-weight:bold;
}

/* SECTION */

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.section-title h3{
    font-size:15px;
}

.apply-btn{
    border:none;
    background:#155eef;
    color:white;
    border-radius:8px;
    height:34px;
    padding:0 12px;
    font-size:8px;
    font-weight:bold;
    cursor:pointer;
}

/* LOAN CARD */

.loan-card{
    background:white;
    border-radius:17px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 3px 14px rgba(0,0,0,.04);
}

.loan-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.loan-title{
    display:flex;
    align-items:center;
    gap:11px;
}

.loan-icon{
    width:43px;
    height:43px;
    border-radius:11px;
    background:#eef3ff;
    color:#155eef;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.loan-name{
    font-size:13px;
    font-weight:bold;
}

.loan-id{
    margin-top:4px;
    color:#8992a1;
    font-size:7px;
    word-break:break-all;
}

.loan-status{
    padding:6px 10px;
    border-radius:20px;
    font-size:7px;
    font-weight:bold;
}

.status-active{
    background:#e7f8ef;
    color:#168352;
}

.status-pending{
    background:#fff4dd;
    color:#b96c00;
}

.status-closed{
    background:#edf0f4;
    color:#667085;
}

.status-rejected{
    background:#ffe9e9;
    color:#d23b3b;
}

/* DETAILS */

.loan-details{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
    margin-top:17px;
}

.detail{
    background:#f7f8fa;
    border-radius:10px;
    padding:11px;
}

.detail span{
    display:block;
    color:#8992a1;
    font-size:7px;
}

.detail strong{
    display:block;
    margin-top:5px;
    font-size:10px;
    word-break:break-word;
}

/* PROGRESS */

.progress-box{
    margin-top:17px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    color:#667085;
    font-size:8px;
}

.progress{
    height:8px;
    background:#e8ebf0;
    border-radius:20px;
    overflow:hidden;
    margin-top:7px;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#155eef;
    border-radius:20px;
    transition:.4s;
}

.progress-note{
    margin-top:6px;
    color:#8992a1;
    font-size:7px;
}

/* BOTTOM */

.loan-bottom{
    margin-top:17px;
    padding-top:15px;
    border-top:1px solid #edf0f4;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.next-emi span{
    display:block;
    color:#8992a1;
    font-size:7px;
}

.next-emi strong{
    display:block;
    margin-top:4px;
    font-size:12px;
}

.loan-actions{
    display:flex;
    gap:7px;
}

.btn{
    height:36px;
    padding:0 12px;
    border-radius:8px;
    border:1px solid #dfe3e9;
    background:white;
    color:#155eef;
    font-size:8px;
    font-weight:bold;
    cursor:pointer;
}

.btn.primary{
    border:none;
    background:#155eef;
    color:white;
}

/* CLOSED */

.closed-section{
    margin-top:25px;
}

.closed-card{
    background:white;
    border-radius:15px;
    padding:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.035);
}

.closed-loan{
    display:flex;
    align-items:center;
    gap:11px;
    padding:12px 0;
    border-bottom:1px solid #edf0f4;
}

.closed-loan:last-child{
    border-bottom:none;
}

.closed-icon{
    width:38px;
    height:38px;
    border-radius:10px;
    background:#f0f2f5;
    display:flex;
    align-items:center;
    justify-content:center;
}

.closed-info{
    flex:1;
}

.closed-info strong{
    display:block;
    font-size:9px;
}

.closed-info p{
    margin-top:4px;
    color:#8992a1;
    font-size:7px;
}

.closed-status{
    color:#168352;
    background:#e7f8ef;
    padding:5px 8px;
    border-radius:20px;
    font-size:7px;
    font-weight:bold;
}

/* EMPTY */

.empty{
    background:white;
    border-radius:17px;
    padding:45px 20px;
    text-align:center;
    display:none;
}

.empty-icon{
    font-size:42px;
}

.empty h3{
    margin-top:10px;
    font-size:15px;
}

.empty p{
    margin-top:6px;
    color:#8992a1;
    font-size:9px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:500;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:19px;
    padding:22px;
}

.modal-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-top h3{
    font-size:17px;
}

.close{
    width:32px;
    height:32px;
    border:none;
    border-radius:50%;
    background:#f0f2f5;
    cursor:pointer;
    font-size:18px;
}

.modal-loan{
    margin-top:17px;
}

.modal-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:11px 0;
    border-bottom:1px solid #edf0f4;
    font-size:9px;
}

.modal-row span{
    color:#8992a1;
}

.modal-row strong{
    text-align:right;
    word-break:break-word;
}

.modal-row:last-child{
    border-bottom:none;
}

.modal-btn{
    width:100%;
    height:43px;
    border:none;
    border-radius:9px;
    background:#155eef;
    color:white;
    margin-top:15px;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
}

/* RESPONSIVE */

@media(max-width:850px){

    .summary{
        grid-template-columns:1fr 1fr;
    }

    .loan-details{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:600px){

    .content{
        padding:15px;
    }

    .header{
        padding:20px 16px 25px;
    }

    .loan-top{
        flex-direction:column;
    }

    .loan-status{
        margin-left:54px;
    }

    .loan-details{
        grid-template-columns:1fr 1fr;
    }

    .loan-bottom{
        align-items:flex-start;
        gap:12px;
        flex-direction:column;
    }

    .loan-actions{
        width:100%;
    }

    .loan-actions .btn{
        flex:1;
    }

}

@media(max-width:380px){

    .summary{
        gap:7px;
    }

    .summary-card{
        padding:12px;
    }

    .summary-value{
        font-size:15px;
    }

    .loan-details{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="header-top">

            <div
                class="back"
                onclick="go('dashboard.html')"
            >
                ←
            </div>

            <div class="header-content">

                <h2>
                    My Loans
                </h2>

                <p>
                    View and manage your loan accounts
                </p>

            </div>

        </div>

    </div>


    <div class="content">

        <div
            class="error-box"
            id="errorBox"
        ></div>


        <!-- SUMMARY -->

        <div class="summary">

            <div class="summary-card">

                <div class="summary-icon">
                    💰
                </div>

                <div class="summary-label">
                    Total Borrowed
                </div>

                <div
                    class="summary-value"
                    id="totalBorrowed"
                >
                    ₹0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-icon">
                    ✓
                </div>

                <div class="summary-label">
                    Total Repaid
                </div>

                <div
                    class="summary-value"
                    id="totalRepaid"
                >
                    ₹0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-icon">
                    📊
                </div>

                <div class="summary-label">
                    Outstanding
                </div>

                <div
                    class="summary-value"
                    id="outstanding"
                >
                    ₹0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-icon">
                    📋
                </div>

                <div class="summary-label">
                    Total Loans
                </div>

                <div
                    class="summary-value"
                    id="totalLoans"
                >
                    0
                </div>

            </div>

        </div>


        <!-- ACTIVE -->

        <div class="section-title">

            <h3>
                My Loan Application
            </h3>

            <button
                class="apply-btn"
                onclick="go('apply-loan.html')"
            >
                + Apply New Loan
            </button>

        </div>


        <!-- LOADING -->

        <div
            class="loading"
            id="loading"
        >
            Loading your loan data...
        </div>


        <!-- LOAN CONTAINER -->

        <div id="loanContainer"></div>


        <!-- EMPTY -->

        <div
            class="empty"
            id="emptyState"
        >

            <div class="empty-icon">
                💰
            </div>

            <h3>
                No Loan Found
            </h3>

            <p>
                You don't have any loan application yet.
            </p>

            <button
                class="modal-btn"
                onclick="go('apply-loan.html')"
            >
                Apply For Loan
            </button>

        </div>


        <!-- CLOSED -->

        <div
            class="closed-section"
            id="closedSection"
            style="display:none"
        >

            <div class="section-title">

                <h3>
                    Loan History
                </h3>

            </div>

            <div
                class="closed-card"
                id="closedContainer"
            ></div>

        </div>

    </div>

</div>


<!-- DETAILS MODAL -->

<div
    class="modal"
    id="detailsModal"
    onclick="outsideModal(event,'detailsModal')"
>

    <div class="modal-box">

        <div class="modal-top">

            <h3>
                Loan Details
            </h3>

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <div
            class="modal-loan"
            id="detailsContent"
        ></div>

    </div>

</div>


<!-- PENDING MODAL -->

<div
    class="modal"
    id="pendingModal"
    onclick="outsideModal(event,'pendingModal')"
>

    <div class="modal-box">

        <div class="modal-top">

            <h3>
                Application Status
            </h3>

            <button
                class="close"
                onclick="closePending()"
            >
                ×
            </button>

        </div>


        <div
            class="modal-loan"
            id="pendingContent"
        ></div>

    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


<script>

/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCCSSnvJ1w9CGd68TAy9ZVH9Taw1J0-xdE",

    authDomain:
        "easyloan-india.firebaseapp.com",

    databaseURL:
        "https://easyloan-india-default-rtdb.firebaseio.com",

    projectId:
        "easyloan-india",

    storageBucket:
        "easyloan-india.firebasestorage.app",

    messagingSenderId:
        "925263655882",

    appId:
        "1:925263655882:web:0dd41e9964bd9a7a93d533"

};


if(!firebase.apps.length){

    firebase.initializeApp(firebaseConfig);

}


const auth =
    firebase.auth();

const db =
    firebase.database();


/* =========================================
   GLOBAL
========================================= */

let currentUser = null;

let loanData = null;

let paymentData = [];

let currentLoanId = null;


/* =========================================
   NAVIGATION
========================================= */

function go(page){

    window.location.href =
        page;

}


/* =========================================
   MONEY
========================================= */

function money(value){

    const number =
        Number(value) || 0;

    return "₹" +
        number.toLocaleString(
            "en-IN",
            {
                maximumFractionDigits:2
            }
        );

}


/* =========================================
   DATE
========================================= */

function formatDate(value){

    if(!value){

        return "--";

    }

    let date;


    if(typeof value === "number"){

        date =
            new Date(value);

    }else{

        date =
            new Date(value);

    }


    if(isNaN(date.getTime())){

        return "--";

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}


/* =========================================
   GET DATE VALUE
========================================= */

function getDateValue(data){

    return (
        data.submittedAt ||
        data.createdAt ||
        data.appliedAt ||
        data.applicationDate ||
        data.updatedAt ||
        null
    );

}


/* =========================================
   STATUS
========================================= */

function normalizeStatus(status){

    return String(
        status || "pending"
    )
    .toLowerCase()
    .replace(/-/g,"_")
    .trim();

}


function statusText(status){

    const s =
        normalizeStatus(status);


    const map = {

        pending:"Pending",

        review_pending:"Under Review",

        under_review:"Under Review",

        processing:"Processing",

        submitted:"Submitted",

        approved:"Approved",

        disbursed:"Disbursed",

        active:"Active",

        completed:"Completed",

        closed:"Closed",

        rejected:"Rejected",

        cancelled:"Cancelled",

        canceled:"Cancelled"

    };


    return map[s] ||
        String(status || "Pending")
            .replace(/_/g," ")
            .replace(/\b\w/g,function(c){
                return c.toUpperCase();
            });

}


/* =========================================
   STATUS CLASS
========================================= */

function statusClass(status){

    const s =
        normalizeStatus(status);


    if(
        s === "active" ||
        s === "approved" ||
        s === "disbursed"
    ){

        return "status-active";

    }


    if(
        s === "closed" ||
        s === "completed"
    ){

        return "status-closed";

    }


    if(
        s === "rejected" ||
        s === "cancelled" ||
        s === "canceled"
    ){

        return "status-rejected";

    }


    return "status-pending";

}


/* =========================================
   IS PAID PAYMENT
========================================= */

function isPaidPayment(payment){

    const s =
        String(
            payment.status || ""
        )
        .toLowerCase()
        .trim();


    return (
        s === "completed" ||
        s === "complete" ||
        s === "verified" ||
        s === "success" ||
        s === "successful" ||
        s === "paid"
    );

}


/* =========================================
   AUTH
========================================= */

auth.onAuthStateChanged(
    async function(user){

        try{

            if(user){

                currentUser =
                    user;

                await loadAll();

                return;

            }


            /*
             * Same anonymous-login flow
             * used by your loan application.
             */

            const result =
                await auth.signInAnonymously();

            currentUser =
                result.user;

            await loadAll();

        }catch(error){

            console.error(error);

            showError(
                "Authentication error: " +
                error.message
            );

            hideLoading();

        }

    }
);


/* =========================================
   LOAD ALL
========================================= */

async function loadAll(){

    showLoading();


    try{

        await loadLoan();

        await loadPayments();

        renderPage();

    }catch(error){

        console.error(
            "Firebase error:",
            error
        );

        showError(
            "Firebase se data load nahi ho saka: " +
            error.message
        );

    }


    hideLoading();

}


/* =========================================
   LOAD LOAN
========================================= */

async function loadLoan(){

    const uid =
        currentUser.uid;


    const snapshot =
        await db
            .ref(
                "loanApplications/" +
                uid
            )
            .once("value");


    if(!snapshot.exists()){

        loanData = null;

        return;

    }


    loanData =
        snapshot.val() || {};


    currentLoanId =
        loanData.applicationId ||
        loanData.loanId ||
        uid;

}


/* =========================================
   LOAD PAYMENTS
========================================= */

async function loadPayments(){

    paymentData = [];


    if(!currentUser){

        return;

    }


    const uid =
        currentUser.uid;


    /*
     * Payment records can use:
     * userId OR uid.
     *
     * We first use userId because
     * your payment page uses userId.
     */

    try{

        const snapshot =
            await db
                .ref("payments")
                .orderByChild("userId")
                .equalTo(uid)
                .once("value");


        if(snapshot.exists()){

            snapshot.forEach(
                function(child){

                    const p =
                        child.val() || {};

                    p._id =
                        child.key;

                    paymentData.push(
                        p
                    );

                }
            );

        }

    }catch(error){

        console.warn(
            "userId payment query:",
            error
        );

    }


    /*
     * If no records were found,
     * also check uid field.
     */

    if(paymentData.length === 0){

        try{

            const snapshot =
                await db
                    .ref("payments")
                    .orderByChild("uid")
                    .equalTo(uid)
                    .once("value");


            if(snapshot.exists()){

                snapshot.forEach(
                    function(child){

                        const p =
                            child.val() || {};

                        p._id =
                            child.key;

                        paymentData.push(
                            p
                        );

                    }
                );

            }

        }catch(error){

            console.warn(
                "uid payment query:",
                error
            );

        }

    }

}


/* =========================================
   RENDER PAGE
========================================= */

function renderPage(){

    if(!loanData){

        renderEmpty();

        updateSummary(
            null
        );

        return;

    }


    renderLoan();

    updateSummary(
        loanData
    );

}


/* =========================================
   SUMMARY
========================================= */

function updateSummary(loan){

    if(!loan){

        document.getElementById(
            "totalBorrowed"
        ).innerText = "₹0";

        document.getElementById(
            "totalRepaid"
        ).innerText = "₹0";

        document.getElementById(
            "outstanding"
        ).innerText = "₹0";

        document.getElementById(
            "totalLoans"
        ).innerText = "0";

        return;

    }


    const amount =
        Number(
            loan.loanAmount ||
            loan.amount ||
            0
        );


    let totalRepaid = 0;


    paymentData.forEach(
        function(payment){

            if(
                isPaidPayment(payment)
            ){

                totalRepaid +=
                    Number(
                        payment.amount ||
                        payment.paidAmount ||
                        0
                    );

            }

        }
    );


    /*
     * If backend has an exact outstanding
     * value, use it. Otherwise calculate.
     */

    let outstanding;


    if(
        loan.outstanding !== undefined &&
        loan.outstanding !== null
    ){

        outstanding =
            Number(
                loan.outstanding
            );

    }else{

        outstanding =
            Math.max(
                amount - totalRepaid,
                0
            );

    }


    document.getElementById(
        "totalBorrowed"
    ).innerText =
        money(amount);


    document.getElementById(
        "totalRepaid"
    ).innerText =
        money(totalRepaid);


    document.getElementById(
        "outstanding"
    ).innerText =
        money(outstanding);


    document.getElementById(
        "totalLoans"
    ).innerText =
        "1";

}


/* =========================================
   RENDER LOAN
========================================= */

function renderLoan(){

    const container =
        document.getElementById(
            "loanContainer"
        );


    container.innerHTML = "";


    document.getElementById(
        "emptyState"
    ).style.display =
        "none";


    const loan =
        loanData;


    const amount =
        Number(
            loan.loanAmount ||
            loan.amount ||
            0
        );


    const tenure =
        Number(
            loan.tenure ||
            loan.loanTenure ||
            loan.term ||
            0
        );


    const emi =
        Number(
            loan.emiAmount ||
            loan.emi ||
            0
        );


    const interest =
        loan.interestRate ||
        loan.interest ||
        loan.rate ||
        "--";


    const status =
        statusText(
            loan.status
        );


    const statusCls =
        statusClass(
            loan.status
        );


    const applicationId =
        loan.applicationId ||
        loan.loanId ||
        currentUser.uid;


    const loanType =
        loan.loanType ||
        loan.type ||
        "Loan";


    const appliedDate =
        formatDate(
            getDateValue(loan)
        );


    /*
     * Real paid amount
     */

    let totalPaid = 0;


    paymentData.forEach(
        function(payment){

            if(
                isPaidPayment(payment)
            ){

                totalPaid +=
                    Number(
                        payment.amount ||
                        payment.paidAmount ||
                        0
                    );

            }

        }
    );


    /*
     * Repayment progress.
     *
     * If total loan amount exists,
     * calculate from actual payments.
     */

    let progress = 0;


    if(amount > 0){

        progress =
            (totalPaid / amount) *
            100;

    }


    progress =
        Math.min(
            Math.max(progress,0),
            100
        );


    /*
     * EMI count
     */

    const paidEmis =
        paymentData.filter(
            function(payment){

                return isPaidPayment(
                    payment
                );

            }
        ).length;


    /*
     * Next payment
     */

    const nextPayment =
        getNextPayment();


    const nextText =
        nextPayment
        ? money(
            nextPayment.amount ||
            nextPayment.paidAmount ||
            emi
          ) +
          " • " +
          formatDate(
              nextPayment.dueDate ||
              nextPayment.nextDueDate ||
              nextPayment.dueAt
          )
        : (
            emi > 0
            ? money(emi)
            : "Not available"
          );


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "loan-card";


    card.innerHTML = `

        <div class="loan-top">

            <div class="loan-title">

                <div class="loan-icon">
                    💰
                </div>

                <div>

                    <div class="loan-name">
                        ${escapeHTML(loanType)}
                    </div>

                    <div class="loan-id">
                        Loan ID: ${escapeHTML(applicationId)}
                    </div>

                </div>

            </div>

            <div class="loan-status ${statusCls}">
                ${escapeHTML(status)}
            </div>

        </div>


        <div class="loan-details">

            <div class="detail">

                <span>
                    Loan Amount
                </span>

                <strong>
                    ${money(amount)}
                </strong>

            </div>


            <div class="detail">

                <span>
                    Outstanding
                </span>

                <strong>
                    ${money(
                        Math.max(
                            amount - totalPaid,
                            0
                        )
                    )}
                </strong>

            </div>


            <div class="detail">

                <span>
                    EMI
                </span>

                <strong>
                    ${emi > 0
                        ? money(emi)
                        : "--"
                    }
                </strong>

            </div>


            <div class="detail">

                <span>
                    Interest
                </span>

                <strong>
                    ${escapeHTML(
                        String(interest)
                    )}${interest !== "--" ? "%" : ""}
                </strong>

            </div>

        </div>


        <div class="loan-details">

            <div class="detail">

                <span>
                    Tenure
                </span>

                <strong>
                    ${tenure > 0
                        ? tenure + " Months"
                        : "--"
                    }
                </strong>

            </div>


            <div class="detail">

                <span>
                    Paid EMIs
                </span>

                <strong>
                    ${paidEmis}
                </strong>

            </div>


            <div class="detail">

                <span>
                    Applied On
                </span>

                <strong>
                    ${escapeHTML(appliedDate)}
                </strong>

            </div>


            <div class="detail">

                <span>
                    Fee Status
                </span>

                <strong>
                    ${escapeHTML(
                        formatFeeStatus(
                            loan.feeStatus
                        )
                    )}
                </strong>

            </div>

        </div>


        <div class="progress-box">

            <div class="progress-top">

                <span>
                    Repayment Progress
                </span>

                <strong>
                    ${progress.toFixed(1)}%
                </strong>

            </div>

            <div class="progress">

                <div
                    class="progress-bar"
                    style="width:${progress}%"
                ></div>

            </div>

            <div class="progress-note">
                ${paidEmis} payment${paidEmis === 1 ? "" : "s"} completed
            </div>

        </div>


        <div class="loan-bottom">

            <div class="next-emi">

                <span>
                    ${isActiveLoan(loan.status)
                        ? "Next EMI"
                        : "Application Status"
                    }
                </span>

                <strong>
                    ${escapeHTML(
                        isActiveLoan(loan.status)
                        ? nextText
                        : status
                    )}
                </strong>

            </div>


            <div class="loan-actions">

                <button
                    class="btn"
                    id="detailsBtn"
                >
                    View Details
                </button>

                ${
                    isActiveLoan(loan.status)
                    ?
                    `
                    <button
                        class="btn primary"
                        id="payBtn"
                    >
                        Pay EMI
                    </button>
                    `
                    :
                    `
                    <button
                        class="btn primary"
                        id="statusBtn"
                    >
                        View Status
                    </button>
                    `
                }

            </div>

        </div>

    `;


    container.appendChild(
        card
    );


    document.getElementById(
        "detailsBtn"
    ).onclick =
        showDetails;


    const payBtn =
        document.getElementById(
            "payBtn"
        );


    if(payBtn){

        payBtn.onclick =
            function(){

                window.location.href =
                    "repayment.html?loanId=" +
                    encodeURIComponent(
                        applicationId
                    );

            };

    }


    const statusBtn =
        document.getElementById(
            "statusBtn"
        );


    if(statusBtn){

        statusBtn.onclick =
            showPending;

    }

}


/* =========================================
   ACTIVE LOAN
========================================= */

function isActiveLoan(status){

    const s =
        normalizeStatus(status);


    return (
        s === "active" ||
        s === "approved" ||
        s === "disbursed"
    );

}


/* =========================================
   NEXT PAYMENT
========================================= */

function getNextPayment(){

    if(!paymentData.length){

        return null;

    }


    const pending =
        paymentData
            .filter(
                function(payment){

                    return !isPaidPayment(
                        payment
                    );

                }
            )
            .sort(
                function(a,b){

                    return (
                        Number(
                            a.dueDate ||
                            a.dueAt ||
                            a.createdAt ||
                            0
                        ) -
                        Number(
                            b.dueDate ||
                            b.dueAt ||
                            b.createdAt ||
                            0
                        )
                    );

                }
            );


    return pending[0] || null;

}


/* =========================================
   FEE STATUS
========================================= */

function formatFeeStatus(status){

    if(!status){

        return "Not available";

    }


    const s =
        String(status)
        .replace(/_/g," ");


    return s.charAt(0).toUpperCase() +
        s.slice(1);

}

/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
