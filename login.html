<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EasyLoan India</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1565c0, #0d47a1);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            margin: 20px;
        }

        .logo {
            text-align: center;
            color: #1565c0;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .logo i {
            font-size: 40px;
            margin-bottom: 10px;
            display: block;
        }

        h2 {
            text-align: center;
            margin-bottom: 5px;
        }

        p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 45px 13px 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: #1565c0;
        }

        .input-group i {
            position: absolute;
            right: 15px;
            top: 42px;
            color: #777;
            cursor: pointer;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .options a {
            color: #1565c0;
            text-decoration: none;
        }

        .options a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            background: #1565c0;
            color: #fff;
            font-size: 17px;
            border-radius: 10px;
            cursor: pointer;
            transition: .3s;
            font-weight: 600;
        }

        .login-btn:hover {
            background: #0d47a1;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            color: #999;
        }

        .google-btn {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: .3s;
        }

        .google-btn:hover {
            background: #f5f5f5;
        }

        .google-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .google-btn i {
            color: red;
            margin-right: 8px;
        }

        .register-link {
            margin-top: 25px;
            text-align: center;
        }

        .register-link a {
            color: #1565c0;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            z-index: 9999;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            transform: translateX(120%);
            transition: transform 0.4s ease;
            max-width: 360px;
            font-size: 14px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: #2e7d32;
        }
        .toast.error {
            background: #c62828;
        }
        .toast.info {
            background: #0d47a1;
        }

        @media(max-width:500px) {
            .login-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <div class="login-container">

        <div class="logo">
            <i class="fa-solid fa-building-columns"></i>
            EasyLoan India
        </div>

        <h2>Welcome Back</h2>
        <p>Login to manage your loan account securely.</p>

        <form id="loginForm">

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
                <i class="fa-solid fa-envelope"></i>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
                <i class="fa-solid fa-eye" id="togglePassword"></i>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox" id="rememberMe">
                    Remember Me
                </label>
                <a href="forgot-password.html">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fa-solid fa-spinner fa-spin" style="display:none;"></i>
                Login
            </button>

        </form>

        <div class="divider">OR</div>

        <button class="google-btn" id="googleBtn">
            <i class="fa-brands fa-google"></i>
            Continue with Google
        </button>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Register Now</a>
        </div>

    </div>

    <script>
        // ============================================================
        // FIREBASE CONFIGURATION
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCCSSnvJ1w9CGd68TAy9ZVH9Taw1J0-xdE",
            authDomain: "easyloan-india.firebaseapp.com",
            projectId: "easyloan-india",
            storageBucket: "easyloan-india.firebasestorage.app",
            messagingSenderId: "925263655882",
            appId: "1:925263655882:web:0dd41e9964bd9a7a93d533"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ============================================================
        // TOAST NOTIFICATION
        // ============================================================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // ============================================================
        // TOGGLE PASSWORD
        // ============================================================
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.onclick = function() {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                togglePassword.classList.remove("fa-eye");
                togglePassword.classList.add("fa-eye-slash");
            } else {
                passwordInput.type = "password";
                togglePassword.classList.remove("fa-eye-slash");
                togglePassword.classList.add("fa-eye");
            }
        };

        // ============================================================
        // CHECK IF USER IS ALREADY LOGGED IN - REDIRECT TO DASHBOARD
        // ============================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                // User is already logged in - redirect to dashboard
                window.location.href = 'dashboard.html';
            } else {
                // Check for remembered email
                const remembered = localStorage.getItem('rememberedEmail');
                if (remembered) {
                    document.getElementById('email').value = remembered;
                    document.getElementById('rememberMe').checked = true;
                }
            }
        });

        // ============================================================
        // LOGIN WITH EMAIL & PASSWORD
        // ============================================================
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const loginBtn = document.getElementById("loginBtn");
            const rememberMe = document.getElementById("rememberMe").checked;

            if (!email || !password) {
                showToast('⚠️ Please fill all fields', 'error');
                return;
            }

            // Show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;

                    // Save email if Remember Me is checked
                    if (rememberMe) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }

                    showToast('✅ Login successful! Redirecting...', 'success');

                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                })
                .catch((error) => {
                    console.error('Login Error:', error);

                    let errorMsg = '❌ Login failed. ';
                    switch (error.code) {
                        case 'auth/user-not-found':
                            errorMsg += 'User not found. Please register first.';
                            break;
                        case 'auth/wrong-password':
                            errorMsg += 'Incorrect password. Please try again.';
                            break;
                        case 'auth/invalid-email':
                            errorMsg += 'Invalid email format.';
                            break;
                        case 'auth/user-disabled':
                            errorMsg += 'This account has been disabled.';
                            break;
                        case 'auth/too-many-requests':
                            errorMsg += 'Too many failed attempts. Please try again later.';
                            break;
                        default:
                            errorMsg += error.message;
                    }
                    showToast(errorMsg, 'error');
                })
                .finally(() => {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Login';
                });
        });

        // ============================================================
        // GOOGLE SIGN-IN
        // ============================================================
        document.getElementById("googleBtn").addEventListener("click", function() {
            const googleBtn = this;
            googleBtn.disabled = true;
            googleBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting...';

            const provider = new firebase.auth.GoogleAuthProvider();

            auth.signInWithPopup(provider)
                .then((result) => {
                    showToast('✅ Google login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                })
                .catch((error) => {
                    console.error('Google Login Error:', error);
                    let errorMsg = '❌ Google login failed. ';
                    if (error.code === 'auth/popup-closed-by-user') {
                        errorMsg += 'Popup was closed. Please try again.';
                    } else if (error.code === 'auth/popup-blocked') {
                        errorMsg += 'Popup was blocked. Please allow popups.';
                    } else {
                        errorMsg += error.message;
                    }
                    showToast(errorMsg, 'error');
                })
                .finally(() => {
                    googleBtn.disabled = false;
                    googleBtn.innerHTML = '<i class="fa-brands fa-google"></i> Continue with Google';
                });
        });

        // ============================================================
        // ENTER KEY SUPPORT
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active && (active.id === 'email' || active.id === 'password')) {
                    document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                }
            }
        });
    </script>

</body>
</html>
