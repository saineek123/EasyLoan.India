<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
    apiKey: "AIzaSyCCSSnvJ1w9CGd68TAy9ZVH9Taw1J0-xdE",
    authDomain: "easyloan-india.firebaseapp.com",
    projectId: "easyloan-india",
    storageBucket: "easyloan-india.firebasestorage.app",
    messagingSenderId: "925263655882",
    appId: "1:925263655882:web:0dd41e9964bd9a7a93d533"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const database = firebase.database();


/* =========================================================
   GLOBAL
========================================================= */

let currentLoan = null;
let currentLoanId = null;
let emiData = [];
let paymentHistory = [];
let currentUser = null;


/* =========================================================
   NAVIGATION
========================================================= */

function go(page){
    window.location.href = page;
}


/* =========================================================
   TOAST
========================================================= */

function showToast(message,type="info"){

    const toast = document.getElementById("toast");

    toast.innerText = message;

    toast.className =
        "toast " + type + " show";

    setTimeout(function(){
        toast.classList.remove("show");
    },4000);
}


/* =========================================================
   AUTH
========================================================= */

auth.onAuthStateChanged(function(user){

    if(!user){

        window.location.href = "login.html";
        return;

    }

    currentUser = user;

    /*
       URL me loanId ho sakta hai,
       lekin actual application Firebase me
       loanApplications/$uid par hai.
    */

    const params =
        new URLSearchParams(
            window.location.search
        );

    currentLoanId =
        params.get("loanId") || null;

    loadLoan();

});


/* =========================================================
   LOAD REAL LOAN APPLICATION
========================================================= */

function loadLoan(){

    if(!currentUser){
        return;
    }

    database
        .ref("loanApplications/" + currentUser.uid)
        .once("value")

        .then(function(snapshot){

            const loan = snapshot.val();

            if(!loan){

                document.getElementById("loader")
                    .style.display = "none";

                showToast(
                    "Loan application not found",
                    "error"
                );

                setTimeout(function(){

                    window.location.href =
                        "my-loans.html";

                },1200);

                return;
            }


            /*
              Agar URL me loanId diya hai
              aur applicationId Firebase me hai,
              to verify karo.
            */

            if(
                currentLoanId &&
                loan.applicationId &&
                String(loan.applicationId) !==
                String(currentLoanId)
            ){

                showToast(
                    "Invalid loan selected",
                    "error"
                );

                setTimeout(function(){

                    window.location.href =
                        "my-loans.html";

                },1200);

                return;
            }


            currentLoan = loan;


            /*
              Actual application ID
            */

            currentLoanId =
                loan.applicationId ||
                currentLoanId ||
                currentUser.uid;


            document.getElementById("loader")
                .style.display = "none";


            document.getElementById("paymentContent")
                .style.display = "block";


            displayLoan();

            loadPayments();

        })

        .catch(function(error){

            console.error(
                "Loan load error:",
                error
            );

            document.getElementById("loader")
                .style.display = "none";

            showToast(
                "Unable to load loan details",
                "error"
            );

        });

}


/* =========================================================
   DISPLAY LOAN
========================================================= */

function displayLoan(){

    const loan = currentLoan;


    document.getElementById("loanIdText")
        .innerText =
        "Loan ID: " +
        (
            loan.applicationId ||
            currentLoanId
        );


    const amount =
        Number(
            loan.loanAmount ||
            loan.amount ||
            0
        );


    document.getElementById("loanAmount")
        .innerText =
        "₹" +
        amount.toLocaleString("en-IN");


    /*
      Real status
    */

    const statusElement =
        document.querySelector(".loan-status");


    if(statusElement){

        statusElement.innerText =
            formatStatus(
                loan.status ||
                "pending"
            );

        applyStatusStyle(
            statusElement,
            loan.status
        );

    }


    createEMI();

}


/* =========================================================
   STATUS
========================================================= */

function formatStatus(status){

    if(!status){
        return "Pending";
    }

    return String(status)
        .replace(/_/g," ")
        .replace(/\b\w/g,function(c){
            return c.toUpperCase();
        });

}


function applyStatusStyle(element,status){

    const s =
        String(status || "").toLowerCase();


    if(
        s === "rejected" ||
        s === "closed"
    ){

        element.style.background = "#ffe9e9";
        element.style.color = "#d23b3b";

    }
    else if(
        s === "approved" ||
        s === "disbursed" ||
        s === "active" ||
        s === "completed"
    ){

        element.style.background = "#e7f8ef";
        element.style.color = "#168352";

    }
    else{

        element.style.background = "#fff4dd";
        element.style.color = "#c77900";

    }

}


/* =========================================================
   REAL EMI SCHEDULE
========================================================= */

function createEMI(){

    const loan = currentLoan;


    const tenure =
        Number(
            loan.tenure ||
            loan.loanTenure ||
            0
        );


    const emi =
        Number(
            loan.emiAmount ||
            loan.emi ||
            0
        );


    emiData = [];


    /*
      Agar EMI/tenure Firebase me nahi hai
      to fake EMI nahi banayenge.
    */

    if(
        tenure <= 0 ||
        emi <= 0
    ){

        renderEMI();
        return;

    }


    let startDate;


    if(loan.startDate){

        startDate =
            new Date(loan.startDate);

    }
    else if(loan.disbursedAt){

        startDate =
            new Date(
                Number(loan.disbursedAt)
            );

    }
    else if(loan.submittedAt){

        startDate =
            new Date(
                Number(loan.submittedAt)
            );

    }
    else{

        startDate = new Date();

    }


    if(isNaN(startDate.getTime())){

        startDate = new Date();

    }


    for(
        let i = 1;
        i <= tenure;
        i++
    ){

        const date =
            new Date(startDate);


        date.setMonth(
            date.getMonth() + i
        );


        emiData.push({

            number: i,

            amount: emi,

            date: date,

            status: "upcoming"

        });

    }


    /*
      Firebase payments ke according
      EMI status update hoga.
    */

    updateEMIStatus();

}


/* =========================================================
   UPDATE EMI STATUS FROM REAL PAYMENTS
========================================================= */

function updateEMIStatus(){

    if(!emiData.length){
        renderEMI();
        return;
    }


    /*
      Completed payments ko EMI-wise map karo.
    */

    const completedPayments =
        paymentHistory.filter(function(payment){

            return String(payment.status || "")
                .toLowerCase() === "completed";

        });


    let paidAmount = 0;


    completedPayments.forEach(function(payment){

        paidAmount +=
            Number(payment.amount || 0);

    });


    emiData.forEach(function(emi){

        const emiAmount =
            Number(emi.amount || 0);


        if(
            paidAmount >= emiAmount
        ){

            emi.status = "paid";

            paidAmount -= emiAmount;

        }
        else{

            const today =
                new Date();

            const dueDate =
                emi.date;


            if(
                dueDate < today
            ){

                emi.status = "overdue";

            }
            else{

                emi.status = "upcoming";

            }

        }

    });


    /*
      First unpaid EMI pending.
    */

    const firstUnpaid =
        emiData.find(function(emi){

            return emi.status !== "paid";

        });


    if(firstUnpaid){

        if(
            firstUnpaid.status !==
            "overdue"
        ){

            firstUnpaid.status =
                "pending";

        }

    }


    renderEMI();

}


/* =========================================================
   RENDER EMI
========================================================= */

function renderEMI(){

    const list =
        document.getElementById("emiList");


    if(!emiData.length){

        list.innerHTML = "";

        document.getElementById("emptyEmi")
            .style.display = "block";

        return;

    }


    document.getElementById("emptyEmi")
        .style.display = "none";


    list.innerHTML =
        emiData.map(function(emi){

            let label = "Upcoming";
            let icon = "📅";


            if(emi.status === "paid"){

                label = "Paid";
                icon = "✓";

            }


            if(emi.status === "pending"){

                label = "Pending";
                icon = "⏳";

            }


            if(emi.status === "overdue"){

                label = "Overdue";
                icon = "⚠";

            }


            const date =
                emi.date.toLocaleDateString(
                    "en-IN",
                    {
                        day:"2-digit",
                        month:"short",
                        year:"numeric"
                    }
                );


            return `

                <div class="emi-item">

                    <div class="emi-icon">
                        ${icon}
                    </div>

                    <div class="emi-info">

                        <div class="emi-number">
                            EMI #${emi.number}
                        </div>

                        <div class="emi-date">
                            ${date}
                        </div>

                    </div>

                    <div class="emi-right">

                        <div class="emi-amount">
                            ₹${Number(
                                emi.amount
                            ).toLocaleString("en-IN")}
                        </div>

                        <span class="status ${emi.status}">
                            ${label}
                        </span>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================================================
   LOAD REAL PAYMENTS
========================================================= */

function loadPayments(){

    if(!currentUser){
        return;
    }


    database
        .ref("payments")
        .orderByChild("userId")
        .equalTo(currentUser.uid)
        .once("value")

        .then(function(snapshot){

            paymentHistory = [];


            snapshot.forEach(function(child){

                const payment =
                    child.val() || {};


                /*
                  Sirf current loan ki payments
                */

                if(
                    payment.loanId &&
                    String(payment.loanId) ===
                    String(currentLoanId)
                ){

                    payment._id =
                        child.key;

                    paymentHistory.push(
                        payment
                    );

                }

            });


            /*
              Agar current loanId applicationId se
              match na kare to uid/application id
              based payment bhi check kar sakte hain.
            */

            if(paymentHistory.length === 0){

                snapshot.forEach(function(child){

                    const payment =
                        child.val() || {};


                    if(
                        payment.loanId ===
                        currentLoan.applicationId
                    ){

                        payment._id =
                            child.key;

                        if(
                            !paymentHistory.some(
                                function(p){
                                    return p._id === child.key;
                                }
                            )
                        ){

                            paymentHistory.push(
                                payment
                            );

                        }

                    }

                });

            }


            calculateTotals();

        })

        .catch(function(error){

            console.error(
                "Payment load error:",
                error
            );

            calculateTotals();

        });

}


/* =========================================================
   CALCULATE REAL TOTALS
========================================================= */

function calculateTotals(){

    let paid = 0;


    paymentHistory.forEach(function(payment){

        const status =
            String(
                payment.status || ""
            ).toLowerCase();


        /*
          Sirf verified/completed payment
          total paid me add hogi.
        */

        if(
            status === "completed" ||
            status === "verified" ||
            status === "success" ||
            status === "successful"
        ){

            paid +=
                Number(
                    payment.amount || 0
                );

        }

    });


    const loanAmount =
        Number(
            currentLoan.loanAmount ||
            currentLoan.amount ||
            0
        );


    const remaining =
        Math.max(
            0,
            loanAmount - paid
        );


    document.getElementById("totalPaid")
        .innerText =
        "₹" +
        paid.toLocaleString("en-IN");


    document.getElementById("remaining")
        .innerText =
        "₹" +
        remaining.toLocaleString("en-IN");


    /*
      EMI status update
    */

    updateEMIStatus();


    /*
      Next pending/overdue EMI
    */

    const pending =
        emiData.find(function(emi){

            return (
                emi.status === "pending" ||
                emi.status === "overdue"
            );

        });


    if(pending){

        document.getElementById("payAmount")
            .value =
            pending.amount;

    }

}


/* =========================================================
   PAYMENT METHOD
========================================================= */

document
.querySelectorAll(".method")
.forEach(function(method){

    method.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(".method")
            .forEach(function(item){

                item.classList.remove(
                    "selected"
                );

            });


            this.classList.add(
                "selected"
            );

        }
    );

});


/* =========================================================
   PAY ALL DUE
========================================================= */

document
.getElementById("payAllBtn")
.addEventListener(
    "click",
    function(){

        let total = 0;


        emiData.forEach(function(emi){

            if(
                emi.status === "pending" ||
                emi.status === "overdue"
            ){

                total +=
                    Number(
                        emi.amount || 0
                    );

            }

        });


        if(total <= 0){

            showToast(
                "No pending EMI found",
                "info"
            );

            return;

        }


        document.getElementById("payAmount")
            .value = total;


        showToast(
            "All due EMI selected: ₹" +
            total.toLocaleString("en-IN"),
            "info"
        );

    }
);


/* =========================================================
   PAY NOW
========================================================= */

document
.getElementById("payNowBtn")
.addEventListener(
    "click",
    function(){

        const amount =
            Number(
                document.getElementById(
                    "payAmount"
                ).value
            );


        if(
            !amount ||
            amount < 100
        ){

            showToast(
                "Minimum payment is ₹100",
                "error"
            );

            return;

        }


        const method =
            document.querySelector(
                ".method.selected"
            );


        const methodName =
            method
            ? method.dataset.method
            : "upi";


        if(!currentUser){

            showToast(
                "Please login again",
                "error"
            );

            return;

        }


        const btn =
            document.getElementById(
                "payNowBtn"
            );


        btn.disabled = true;


        btn.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Submitting...';


        /*
          IMPORTANT:

          User payment ko direct completed
          nahi kar rahe.

          status = created

          Admin/backend verify karega,
          phir status = completed karega.
        */

        const paymentRef =
            database
            .ref("payments")
            .push();


        const transactionId =
            "TXN" + Date.now();


        const paymentData = {

            id:
                paymentRef.key,

            loanId:
                currentLoanId,

            userId:
                currentUser.uid,

            amount:
                amount,

            method:
                methodName,

            transactionId:
                transactionId,

            status:
                "created",

            createdAt:
                firebase.database.ServerValue.TIMESTAMP

        };


        paymentRef
        .set(paymentData)

        .then(function(){

            showToast(
                "Payment request submitted. Verification pending.",
                "success"
            );


            openReceipt(
                amount,
                methodName,
                transactionId,
                "Pending Verification"
            );


            document.getElementById(
                "payAmount"
            ).value = "";


            loadPayments();

        })

        .catch(function(error){

            console.error(
                "Payment create error:",
                error
            );


            showToast(
                "Payment request failed: " +
                error.message,
                "error"
            );

        })

        .finally(function(){

            btn.disabled = false;

            btn.innerHTML =
                '<i class="fa-solid fa-lock"></i> Pay Now';

        });

    }
);


/* =========================================================
   OPEN RECEIPT
========================================================= */

function openReceipt(
    amount,
    method,
    txn,
    status
){

    document.getElementById("rAmount")
        .innerText =
        "₹" +
        Number(amount)
        .toLocaleString("en-IN");


    document.getElementById("rMethod")
        .innerText =
        String(method).toUpperCase();


    document.getElementById("rTxn")
        .innerText =
        txn;


    document.getElementById("rStatus")
        .innerText =
        status;


    document.getElementById("rDate")
        .innerText =
        new Date().toLocaleString(
            "en-IN"
        );


    document.getElementById("receiptModal")
        .style.display = "flex";

}


/* =========================================================
   CLOSE RECEIPT
========================================================= */

function closeReceipt(){

    document.getElementById("receiptModal")
        .style.display = "none";

}


/* =========================================================
   CLOSE OUTSIDE
========================================================= */

document
.getElementById("receiptModal")
.addEventListener(
    "click",
    function(e){

        if(e.target === this){

            closeReceipt();

        }

    }
);

</script>
