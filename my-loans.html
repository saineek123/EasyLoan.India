<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Loans - LoanApp</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fa;
            color: #172033;
        }

        .app {
            max-width: 520px;
            margin: auto;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        /* HEADER */

        .header {
            background: linear-gradient(135deg, #155eef, #4f8cff);
            color: white;
            padding: 20px 18px 25px;
            border-radius: 0 0 25px 25px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .back {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255,255,255,0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
        }

        .header h2 {
            font-size: 20px;
        }

        .header p {
            margin-top: 5px;
            font-size: 12px;
            opacity: .85;
        }

        /* TABS */

        .tabs {
            display: flex;
            margin: 15px;
            background: white;
            border-radius: 12px;
            padding: 5px;
            box-shadow: 0 3px 15px rgba(0,0,0,.05);
        }

        .tab {
            flex: 1;
            padding: 11px 5px;
            text-align: center;
            border-radius: 9px;
            font-size: 12px;
            color: #788294;
            cursor: pointer;
        }

        .tab.active {
            background: #155eef;
            color: white;
            font-weight: bold;
        }

        /* CONTENT */

        .content {
            padding: 0 15px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* LOAN CARD */

        .loan-card {
            background: white;
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 4px 18px rgba(0,0,0,.05);
            margin-bottom: 14px;
        }

        .loan-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .loan-title {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .loan-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: #edf3ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .loan-title h3 {
            font-size: 15px;
        }

        .loan-title p {
            margin-top: 4px;
            font-size: 10px;
            color: #7c8596;
        }

        .status {
            padding: 6px 9px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: bold;
        }

        .pending {
            background: #fff4d6;
            color: #a96d00;
        }

        .approved {
            background: #e4f8ed;
            color: #14824f;
        }

        .rejected {
            background: #ffe7e7;
            color: #c43333;
        }

        .disbursed {
            background: #e8efff;
            color: #155eef;
        }

        /* LOAN AMOUNT */

        .amount-section {
            margin-top: 20px;
            background: #f5f7fb;
            border-radius: 13px;
            padding: 15px;
            text-align: center;
        }

        .amount-section small {
            color: #7c8596;
            font-size: 11px;
        }

        .amount-section h2 {
            color: #155eef;
            margin-top: 5px;
            font-size: 25px;
        }

        /* INFO */

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 13px;
        }

        .info {
            background: #f7f8fa;
            border-radius: 10px;
            padding: 10px;
        }

        .info small {
            display: block;
            color: #858e9e;
            font-size: 9px;
        }

        .info strong {
            display: block;
            margin-top: 5px;
            font-size: 12px;
        }

        /* PROGRESS */

        .loan-progress {
            margin-top: 18px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #737d8e;
            margin-bottom: 7px;
        }

        .progress-bar {
            width: 100%;
            height: 7px;
            background: #e9edf3;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 35%;
            background: #155eef;
            border-radius: 20px;
        }

        /* BUTTONS */

        .card-buttons {
            display: flex;
            gap: 9px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            height: 40px;
            border-radius: 9px;
            border: none;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .primary {
            background: #155eef;
            color: white;
        }

        .secondary {
            background: #eef1f5;
            color: #4f596a;
        }

        /* NEXT EMI */

        .emi-card {
            background: linear-gradient(135deg, #102a67, #155eef);
            color: white;
            border-radius: 17px;
            padding: 18px;
            margin-bottom: 14px;
        }

        .emi-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .emi-top small {
            opacity: .8;
            font-size: 11px;
        }

        .emi-top h3 {
            margin-top: 6px;
            font-size: 23px;
        }

        .calendar {
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,.16);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .emi-bottom {
            margin-top: 17px;
            padding-top: 13px;
            border-top: 1px solid rgba(255,255,255,.2);
            display: flex;
            justify-content: space-between;
            font-size: 11px;
        }

        /* HISTORY */

        .history-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 3px 14px rgba(0,0,0,.04);
        }

        .history-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-icon {
            width: 42px;
            height: 42px;
            border-radius: 11px;
            background: #edf3ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .history-left h4 {
            font-size: 13px;
        }

        .history-left p {
            color: #7d8796;
            font-size: 9px;
            margin-top: 4px;
        }

        .history-amount {
            text-align: right;
        }

        .history-amount strong {
            font-size: 14px;
        }

        .history-amount small {
            display: block;
            color: #7d8796;
            font-size: 9px;
            margin-top: 4px;
        }

        .history-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            margin-top: 13px;
            background: #f7f8fa;
            border-radius: 9px;
            padding: 10px;
        }

        .history-details div {
            text-align: center;
        }

        .history-details small {
            display: block;
            color: #818b9b;
            font-size: 8px;
        }

        .history-details strong {
            display: block;
            margin-top: 4px;
            font-size: 11px;
        }

        /* EMPTY */

        .empty {
            background: white;
            border-radius: 17px;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0,0,0,.04);
        }

        .empty-icon {
            font-size: 45px;
        }

        .empty h3 {
            margin-top: 12px;
            font-size: 17px;
        }

        .empty p {
            margin-top: 7px;
            color: #7b8494;
            font-size: 11px;
            line-height: 1.5;
        }

        .empty button {
            margin-top: 17px;
            border: none;
            background: #155eef;
            color: white;
            padding: 11px 20px;
            border-radius: 9px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        /* BOTTOM NAV */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 520px;
            height: 70px;
            background: white;
            border-top: 1px solid #e5e8ed;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            text-align: center;
            color: #8a93a4;
            font-size: 9px;
            cursor: pointer;
        }

        .nav-item .icon {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .nav-item.active {
            color: #155eef;
            font-weight: bold;
        }

        @media(max-width:360px) {

            .info-grid {
                grid-template-columns: 1fr 1fr;
            }

            .history-details {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="header-top">

            <div class="back" onclick="go('index.html')">
                ←
            </div>

            <div>
                <h2>My Loans</h2>
                <p>Track your loan applications</p>
            </div>

        </div>

    </div>


    <!-- TABS -->

    <div class="tabs">

        <div class="tab active" onclick="showTab('active', this)">
            Active
        </div>

        <div class="tab" onclick="showTab('history', this)">
            History
        </div>

    </div>


    <div class="content">

        <!-- ACTIVE LOANS -->

        <div class="tab-content active" id="active">
            <div id="activeLoading" class="empty">
                <div class="empty-icon">⏳</div>
                <h3>Loading your loans...</h3>
                <p>Please wait while we load your real loan data.</p>
            </div>
            <div id="activeLoans"></div>
        </div>


        <!-- HISTORY -->

        <div class="tab-content" id="history">
            <div id="historyLoading" class="empty">
                <div class="empty-icon">⏳</div>
                <h3>Loading history...</h3>
                <p>Please wait while we load your real loan history.</p>
            </div>
            <div id="loanHistory"></div>
        </div>
    </div>


    <!-- BOTTOM NAV -->

    <div class="bottom-nav">

        <div class="nav-item" onclick="go('index.html')">
            <div class="icon">🏠</div>
            Home
        </div>

        <div class="nav-item active">
            <div class="icon">📋</div>
            My Loans
        </div>

        <div class="nav-item" onclick="go('apply-loan.html')">
            <div class="icon">➕</div>
            Apply
        </div>

        <div class="nav-item" onclick="go('support.html')">
            <div class="icon">🎧</div>
            Support
        </div>

        <div class="nav-item" onclick="go('profile.html')">
            <div class="icon">👤</div>
            Profile
        </div>

    </div>

</div>


<script>
const firebaseConfig = {
    apiKey: "AIzaSyCCSSnvJ1w9CGd68TAy9ZVH9Taw1J0-xdE",
    authDomain: "easyloan-india.firebaseapp.com",
    projectId: "easyloan-india",
    storageBucket: "easyloan-india.firebasestorage.app",
    messagingSenderId: "925263655882",
    appId: "1:925263655882:web:0dd41e9964bd9a7a93d533"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const database = firebase.database();

let currentUser = null;

function go(page) {
    window.location.href = page;
}

function showTab(tabName, element) {
    document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
    element.classList.add("active");
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    document.getElementById(tabName).classList.add("active");
}

function money(value) {
    if (value === undefined || value === null || value === "") return "—";
    const n = Number(value);
    return Number.isNaN(n) ? String(value) : "₹" + n.toLocaleString("en-IN");
}

function dateText(value) {
    if (!value) return "—";
    const d = new Date(Number(value));
    if (Number.isNaN(d.getTime())) return "—";
    return d.toLocaleDateString("en-IN", {
        day: "2-digit", month: "short", year: "numeric"
    });
}

function esc(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;").replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function statusClass(status) {
    const s = String(status || "").toLowerCase();
    if (s.includes("approved")) return "approved";
    if (s.includes("disbursed") || s.includes("active")) return "disbursed";
    if (s.includes("reject")) return "rejected";
    return "pending";
}

function statusText(status) {
    const s = String(status || "pending").toLowerCase();
    const map = {
        pending: "Pending",
        "under review": "Under Review",
        processing: "Processing",
        approved: "Approved",
        rejected: "Rejected",
        disbursed: "Disbursed",
        active: "Active",
        completed: "Completed",
        closed: "Closed"
    };
    return map[s] || status || "Pending";
}

function amountOf(loan) {
    return loan.amount ?? loan.loanAmount ?? loan.principal ?? null;
}

function emiOf(loan) {
    return loan.emi ?? loan.monthlyEmi ?? loan.monthlyEMI ?? null;
}

function tenureOf(loan) {
    return loan.tenure ?? loan.tenureMonths ?? loan.durationMonths ?? null;
}

function interestOf(loan) {
    return loan.interestRate ?? loan.interest ?? loan.rate ?? null;
}

function idOf(loan) {
    return loan.applicationId ?? loan.loanNumber ??
        loan.applicationNumber ?? loan.loanId ?? loan._id;
}

function progressOf(loan) {
    const s = String(loan.status || "").toLowerCase();
    if (s === "completed" || s === "closed" || s === "rejected") return 100;
    if (s === "disbursed" || s === "active") return 90;
    if (s === "approved") return 70;
    return 35;
}

function viewDetails(id) {
    window.location.href = "loan-details.html?id=" + encodeURIComponent(id);
}

function openRepayment(id) {
    window.location.href = "repayment.html?id=" + encodeURIComponent(id);
}

function renderActive(loans) {
    const box = document.getElementById("activeLoans");
    document.getElementById("activeLoading").style.display = "none";
    box.innerHTML = "";

    const active = loans.filter(loan => {
        const s = String(loan.status || "").toLowerCase();
        return ["pending", "under review", "processing", "approved",
                "disbursed", "active"].includes(s);
    });

    if (!active.length) {
        box.innerHTML = `
            <div class="empty">
                <div class="empty-icon">📋</div>
                <h3>No active loan</h3>
                <p>You do not have any active or pending loan application.</p>
                <button onclick="go('apply-loan.html')">Apply for Loan</button>
            </div>`;
        return;
    }

    active.forEach(loan => {
        const id = loan._id;
        const amount = amountOf(loan);
        const emi = emiOf(loan);
        const tenure = tenureOf(loan);
        const interest = interestOf(loan);
        const progress = progressOf(loan);
        const status = statusText(loan.status);
        const title = loan.loanType || "Loan";
        const loanId = idOf(loan);

        const card = document.createElement("div");
        card.className = "loan-card";
        card.innerHTML = `
            <div class="loan-card-top">
                <div class="loan-title">
                    <div class="loan-icon">💰</div>
                    <div>
                        <h3>${esc(title)}</h3>
                        <p>Application #${esc(loanId)}</p>
                    </div>
                </div>
                <div class="status ${statusClass(loan.status)}">${esc(status)}</div>
            </div>

            <div class="amount-section">
                <small>${String(loan.status || "").toLowerCase() === "approved" ? "Approved Amount" : "Loan Amount"}</small>
                <h2>${money(amount)}</h2>
            </div>

            <div class="info-grid">
                <div class="info">
                    <small>Tenure</small>
                    <strong>${tenure !== null ? esc(tenure) + " Months" : "—"}</strong>
                </div>
                <div class="info">
                    <small>Interest</small>
                    <strong>${interest !== null ? esc(interest) + (String(interest).includes("%") ? "" : "% p.a.") : "—"}</strong>
                </div>
                <div class="info">
                    <small>EMI</small>
                    <strong>${money(emi)}</strong>
                </div>
            </div>

            <div class="loan-progress">
                <div class="progress-label">
                    <span>Application Progress</span><span>${progress}%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width:${progress}%"></div>
                </div>
            </div>

            <div class="card-buttons">
                <button class="btn secondary" onclick="viewDetails('${String(id).replaceAll("'", "\\'")}')">View Details</button>
                <button class="btn primary" onclick="openRepayment('${String(id).replaceAll("'", "\\'")}')">
                    ${["approved", "disbursed", "active"].includes(String(loan.status || "").toLowerCase()) ? "Repayment" : "View"}
                </button>
            </div>`;
        box.appendChild(card);
    });
}

function renderHistory(loans) {
    const box = document.getElementById("loanHistory");
    document.getElementById("historyLoading").style.display = "none";
    box.innerHTML = "";

    const history = loans.filter(loan =>
        ["completed", "closed", "rejected"].includes(
            String(loan.status || "").toLowerCase()
        )
    );

    if (!history.length) {
        box.innerHTML = `
            <div class="empty">
                <div class="empty-icon">🗂️</div>
                <h3>No loan history</h3>
                <p>Your completed or rejected loan applications will appear here.</p>
            </div>`;
        return;
    }

    history.forEach(loan => {
        const id = loan._id;
        const card = document.createElement("div");
        card.className = "history-card";
        card.innerHTML = `
            <div class="history-top">
                <div class="history-left">
                    <div class="history-icon">💰</div>
                    <div>
                        <h4>${esc(loan.loanType || "Loan")}</h4>
                        <p>${esc(idOf(loan))} • ${esc(statusText(loan.status))}</p>
                    </div>
                </div>
                <div class="history-amount">
                    <strong>${money(amountOf(loan))}</strong>
                    <small>${esc(statusText(loan.status))}</small>
                </div>
            </div>

            <div class="history-details">
                <div>
                    <small>Tenure</small>
                    <strong>${tenureOf(loan) !== null ? esc(tenureOf(loan)) + " Months" : "—"}</strong>
                </div>
                <div>
                    <small>EMI</small>
                    <strong>${money(emiOf(loan))}</strong>
                </div>
                <div>
                    <small>Date</small>
                    <strong>${esc(dateText(loan.completedAt || loan.updatedAt || loan.createdAt))}</strong>
                </div>
            </div>`;
        box.appendChild(card);
    });
}

function renderNextEmi(loans) {
    const loan = loans.find(l =>
        ["approved", "disbursed", "active"].includes(
            String(l.status || "").toLowerCase()
        )
    );

    if (!loan) return;

    const emi = emiOf(loan);
    const due = loan.nextEmiDate || loan.nextDueDate || loan.dueDate;

    if (emi === null && !due) return;

    const card = document.createElement("div");
    card.className = "emi-card";
    card.innerHTML = `
        <div class="emi-top">
            <div>
                <small>Next EMI</small>
                <h3>${money(emi)}</h3>
            </div>
            <div class="calendar">📅</div>
        </div>
        <div class="emi-bottom">
            <span>Due Date</span>
            <strong>${esc(dateText(due))}</strong>
        </div>`;

    document.getElementById("activeLoans").before(card);
}

async function loadLoans() {
    if (!currentUser) return;

    try {
        const snap = await database.ref("loans/" + currentUser.uid).once("value");
        const raw = snap.val() || {};

        const loans = Object.entries(raw).map(([id, loan]) => ({
            ...(loan || {}),
            _id: id
        }));

        loans.sort((a, b) =>
            Number(b.createdAt || b.timestamp || 0) -
            Number(a.createdAt || a.timestamp || 0)
        );

        renderActive(loans);
        renderHistory(loans);
        renderNextEmi(loans);

    } catch (error) {
        console.error("Firebase loan loading error:", error);

        document.getElementById("activeLoading").innerHTML = `
            <div class="empty">
                <div class="empty-icon">⚠️</div>
                <h3>Unable to load loans</h3>
                <p>Firebase permission or connection problem.</p>
                <button onclick="loadLoans()">Retry</button>
            </div>`;

        document.getElementById("historyLoading").innerHTML = `
            <div class="empty">
                <div class="empty-icon">⚠️</div>
                <h3>Unable to load history</h3>
                <p>Check your Firebase Realtime Database Rules.</p>
            </div>`;
    }
}

auth.onAuthStateChanged(user => {
    if (!user) {
        window.location.replace("login.html");
        return;
    }

    currentUser = user;
    loadLoans();
});
</script>

</body>
</html>
